# [project] tablosu: Vercel'in yeni Python build sistemi (uv) bunu
# okuyor - `requirements.txt` ile BIREBIR AYNI TUTULMALI (asagidaki
# dependencies listesi). requirements.txt Railway/Render gibi
# Vercel disi platformlar ve `pip install -r` ile yerel kurulum icin
# hala duruyor; ikisi arasinda tek gercek kaynak yok, elle senkron.
[project]
name = "what-is-the-next-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django==5.2.17",
    "djangorestframework==3.18.1",
    "djangorestframework-simplejwt==5.5.1",
    "django-cors-headers==4.9.0",
    "django-environ==0.14.0",
    "psycopg[binary]==3.3.6",
    "whitenoise==6.12.0",
    "gunicorn==26.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "DJ",  # flake8-django
    "C4",  # comprehensions
    "SIM", # simplify
]
ignore = [
    "E501",  # satir uzunlugunu black yonetiyor
]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "config", "polls"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '/(\.venv|migrations)/'

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
